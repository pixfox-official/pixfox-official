name: Generate Metrics

on:
  schedule:
    # '0 0 * * *' означает запуск каждый день в 00:00 по UTC (всемирное координированное время)
    - cron: '0 0 * * *' 
  workflow_dispatch: # Эта строка позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Дает боту право сохранять картинку в ваш репозиторий

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: pixfox-official #Не забудьте заменить на ваш логин!
          template: classic
          
          # --- Базовые блоки ---
          base: header, activity, community
          
          # --- Включаем объёмный календарь ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year # 'full-year' — за весь год, 'half-year' — за полгода
          
          # --- Оранжевые акценты ---
          extras_css: |
            h2 {
              color: #FF8C00 !important;
              border-bottom: 2px solid #FF8C00 !important;
            }
